name: DB RLS harness

on:
  push:
    branches: [finish/agricoop-complete, main]
  pull_request:
    branches: [finish/agricoop-complete, main]

jobs:
  rls-harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agricoop_login
          POSTGRES_PASSWORD: agricoop_test_password
          POSTGRES_DB: agricoop_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agricoop_login -d agricoop_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://agricoop_login:agricoop_test_password@127.0.0.1:55432/agricoop_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Bootstrap throwaway Postgres
        run: pnpm run db:test:setup
      - name: Lint
        run: pnpm run lint
      - name: Unit + RLS harness
        run: pnpm test
